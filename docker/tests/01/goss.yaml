---
# runtime docker tests
file:
  /opt/besu/bin/besu:
    exists: true
    mode: "0755"
    owner: besu
    group: besu
    filetype: file
    contains: []
  /opt/besu/database:
    exists: true
    mode: "0755"
    owner: besu
    group: besu
    filetype: directory
    contains: []
  /opt/besu/key:
    exists: true
    mode: "0600"
    owner: besu
    group: besu
    filetype: file
    contains: []
process:
  java:
    running: true
command:
  check-besu-rpc-http-host:
    exec: "test \"$BESU_RPC_HTTP_HOST\" = \"0.0.0.0\""
    exit-status: 0
  check-besu-rpc-ws-host:
    exec: "test \"$BESU_RPC_WS_HOST\" = \"0.0.0.0\""
    exit-status: 0
  check-besu-graphql-http-host:
    exec: "test \"$BESU_GRAPHQL_HTTP_HOST\" = \"0.0.0.0\""
    exit-status: 0
http:
  # the GraphQL plugin bundled with the distribution serves GraphQL
  http://localhost:8547/graphql:
    status: 200
    method: POST
    request-headers:
      - "Content-Type: application/json"
    request-body: '{"query":"{block(number:0){number}}"}'
    body:
      - '/"number"\s*:\s*"0x0"/'
